# ClusterPropagationPolicy for the Karmada-native baseline.
#
# Replaces the label-driven policies used by the AI approach
# (scripts/clusterpropagationpolicy.yaml) during baseline runs.
#
# How the three baseline rules map to this policy:
#
# 1. "Whole workload in a single cluster" — each clusterAffinities group
#    contains exactly one cluster, so the scheduler can never split the
#    replicas of one workload across member1 and member2. Aggregated
#    division over a single-cluster group is all-or-nothing.
#
# 2. "Burst to the public cloud only when needed" — the karmada-scheduler
#    walks clusterAffinities in order: it first tries 'private-first' 
#    ([member1]); Divided+Aggregated makes that attempt capacity-checked
#    (the scheduler-estimator-member1 gRPC service gives a precise per-node
#    estimate, min()-ed with the general estimator). Only when member1
#    cannot host ALL replicas does the scheduler fall through to
#    'public-burst' ([member2]).
#
# 3. "Never fail silently" — member2's capacity is estimated by the
#    general estimator only (setup_baseline.sh scales
#    karmada-scheduler-estimator-member2 to 0; per-cluster gRPC failures
#    yield UnauthenticReplica, which calAvailableReplicas skips). The
#    general estimator sums Cluster.Status.ResourceSummary over ALL nodes,
#    taints included — so the huge tainted 'member2-virtual-capacity' node
#    (virtual-capacity-node.yaml) makes the 'public-burst' group always
#    succeed. Real pods are then created in member2; whatever doesn't fit
#    real nodes stays genuinely Pending (visible in Prometheus as
#    kube_pod_status_phase{phase="Pending"}), giving the Cluster
#    Autoscaler its normal trigger to add nodes.
#
# 4. "Repair same-second over-admission" — spec.failover.application. The
#    gRPC/general-estimator checks above are pre-admission only: same-second
#    bursts can still over-admit member1 (gRPC doesn't count pods still
#    unbound), leaving losers stuck whole in member1, genuinely Pending,
#    with karmada-descheduler off so nothing else would move them.
#    Application Failover watches each ResourceBinding's per-cluster health —
#    any Pending replica marks the whole Deployment Unhealthy — and past
#    tolerationSeconds evicts that cluster from Spec.Clusters, forcing the
#    scheduler to replace the *whole* resource (member1 still full → lands
#    whole in member2, never split — unlike karmada-descheduler's partial
#    eviction, which is why rule 1 holds). Deployments only: batch/v1 Job has
#    no default health interpreter in this Karmada version.
apiVersion: policy.karmada.io/v1alpha1
kind: ClusterPropagationPolicy
metadata:
  name: baseline-native
spec:
  conflictResolution: Overwrite
  propagateDeps: true
  resourceSelectors:
    - apiVersion: apps/v1
      kind: Deployment
      namespace: default
    - apiVersion: batch/v1
      kind: Job
      namespace: default
  placement:
    clusterAffinities:
      - affinityName: private-first
        clusterNames: [member1]
      - affinityName: public-burst
        clusterNames: [member2]
    replicaScheduling:
      replicaSchedulingType: Divided
      replicaDivisionPreference: Aggregated
  failover:
    application:
      decisionConditions:
        tolerationSeconds: 60
      purgeMode: Graciously
      gracePeriodSeconds: 60
